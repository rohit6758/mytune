<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="MyTune — Ignite Your Sound. Discover, swipe and share 30-second music loops." />
    <title>MyTune</title>

    <!-- Google Fonts: Montserrat & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        color: #e5e2e1;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
      }
      .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <style>
        #splash {
          position: fixed; top: 0; left: 0; right: 0; bottom: 0;
          background: #000; display: flex; flex-direction: column;
          align-items: center; justify-content: center; z-index: 9999;
        }
        #splash img { width: 120px; height: auto; border-radius: 24px; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse {
          0% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.05); opacity: 0.7; }
          100% { transform: scale(1); opacity: 1; }
        }
      </style>
      <div id="splash">
        <img src="/logo.png" alt="MyTune" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
